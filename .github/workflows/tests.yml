name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Install pinned dependencies and Hypatia
        run: |
          python -m pip install --upgrade pip
          pip install -r ci/requirements.txt
          # --no-deps: keep exactly the pinned versions above
          pip install -e . --no-deps

      - name: Run tests (slow examples excluded, see pytest.ini)
        run: pytest -ra
