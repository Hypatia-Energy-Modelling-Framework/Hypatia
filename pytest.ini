[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not slow"
markers =
    slow: solves an example that needs minutes with open-source solvers; run locally with -m slow (Gurobi recommended)
# The examples print solver logs and pandas emits many FutureWarnings with old dependency pins.
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
